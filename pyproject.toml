[project]
name = "weather-edge"
version = "0.1.0"
description = "Local weather market research and paper execution"
requires-python = ">=3.13,<3.15"
dependencies = [
    "eccodes>=2.42,<3",
    "eccodeslib>=2.50.0.34",
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
